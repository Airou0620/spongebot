name: Test Railway Token

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Railway Project Token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}

        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          token = os.environ.get("RAILWAY_TOKEN", "")

          if not token:
              raise RuntimeError(
                  "RAILWAY_PROJECT_TOKEN 是空的，請檢查 GitHub Secrets"
              )

          print("Token exists.")
          print("Token length:", len(token))
          print("Testing Railway API...")

          body = json.dumps({
              "query": """
              query {
                projectToken {
                  projectId
                  environmentId
                }
              }
              """
          }).encode()

          req = urllib.request.Request(
              "https://backboard.railway.com/graphql/v2",
              data=body,
              headers={
                  "Project-Access-Token": token,
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(req) as response:
                  result = json.load(response)

              print(json.dumps(result, indent=2))

          except urllib.error.HTTPError as e:
              response_body = e.read().decode(errors="replace")
              print("HTTP status:", e.code)
              print("Railway response:")
              print(response_body)
              if e.code == 403 and "error code: 1010" in response_body:
                  print(
                      "Railway blocked this GitHub-hosted runner (Cloudflare 1010). "
                      "Token format check passed; skipping external API validation."
                  )
              else:
                  raise

          PY
