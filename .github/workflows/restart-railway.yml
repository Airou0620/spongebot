name: Restart Railway Bot

on:
  schedule:
    - cron: "7 * * * *"

  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest

    steps:
      - name: Restart Railway Bot
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
          SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}

        run: |
          set -e

          API="https://backboard.railway.com/graphql/v2"

          echo "Testing Railway token..."

          TOKEN_INFO=$(curl --fail-with-body -sS \
            -X POST "$API" \
            -H "Project-Access-Token: $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0" \
            --data '{"query":"query { projectToken { projectId environmentId } }"}')

          echo "$TOKEN_INFO"

          export TOKEN_INFO

          PROJECT_ID=$(python3 - <<'PY'
          import json, os

          data = json.loads(os.environ["TOKEN_INFO"])

          if data.get("errors"):
              raise RuntimeError(data["errors"])

          print(data["data"]["projectToken"]["projectId"])
          PY
          )

          ENVIRONMENT_ID=$(python3 - <<'PY'
          import json, os

          data = json.loads(os.environ["TOKEN_INFO"])
          print(data["data"]["projectToken"]["environmentId"])
          PY
          )

          echo "Project: $PROJECT_ID"
          echo "Environment: $ENVIRONMENT_ID"
          echo "Service: $SERVICE_ID"

          DEPLOYMENTS=$(curl --fail-with-body -sS \
            -X POST "$API" \
            -H "Project-Access-Token: $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0" \
            --data "$(python3 - <<PY
          import json

          print(json.dumps({
              "query": """
              query(\$input: DeploymentListInput!) {
                deployments(input: \$input, first: 10) {
                  edges {
                    node {
                      id
                      status
                      createdAt
                    }
                  }
                }
              }
              """,
              "variables": {
                  "input": {
                      "projectId": "$PROJECT_ID",
                      "environmentId": "$ENVIRONMENT_ID",
                      "serviceId": "$SERVICE_ID"
                  }
              }
          }))
          PY
          )")

          export DEPLOYMENTS

          DEPLOYMENT_ID=$(python3 - <<'PY'
          import json, os

          data = json.loads(os.environ["DEPLOYMENTS"])

          if data.get("errors"):
              raise RuntimeError(data["errors"])

          for edge in data["data"]["deployments"]["edges"]:
              d = edge["node"]

              if d["status"] in ("SUCCESS", "SLEEPING"):
                  print(d["id"])
                  break
          else:
              raise RuntimeError("找不到目前可 restart 的 deployment")
          PY
          )

          echo "Restarting deployment: $DEPLOYMENT_ID"

          RESTART_RESULT=$(curl --fail-with-body -sS \
            -X POST "$API" \
            -H "Project-Access-Token: $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0" \
            --data "$(python3 - <<PY
          import json

          print(json.dumps({
              "query": """
              mutation(\$id: String!) {
                deploymentRestart(id: \$id)
              }
              """,
              "variables": {
                  "id": "$DEPLOYMENT_ID"
              }
          }))
          PY
          )")

          echo "$RESTART_RESULT"
